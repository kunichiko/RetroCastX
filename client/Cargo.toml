[package]
name = "retrocastx-viewer"
version = "0.14.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
# コンソール窓を出さずに起動し(windows_subsystem)、コンソールから起動された
# ときだけ親のコンソールへ出力を戻すため
# 残りの feature は NIC 受信バッファーの確認(src/netcheck.rs)に使う。
# 経路から NIC を引き、レジストリの *ReceiveBuffers を読む
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    # ConvertInterface* は LUID 型が Ndis 側にあるため、この feature の配下にある
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    # 受信バッファーを**その場で直す**ための昇格実行(ShellExecuteW の runas)
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 遊んでいる間のスリープ抑止(src/awake.rs の SetThreadExecutionState)
    "Win32_System_Power",
] }

[target.'cfg(windows)'.build-dependencies]
# 実行ファイルへのアイコン埋め込み(build.rs)。Windows以外では取得も不要
winresource = "0.1"

# MimicX へのキー転送(src/remote_input.rs)。MimicX は macOS 版だけで、CoreMIDI も
# 同一マシン内の経路なので、依存ごと macOS に閉じる
[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
# 通常モード(eframe)で物理キーを取り出すため(src/keytap.rs)。egui の Key は
# JIS の ¥/_/かな を持たず、テンキーも最上段の数字に潰すので、AppKit の
# イベントを直接見るしかない
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }
# フルスクリーンで「実際に画面に出た時刻」(MTLDrawable.presentedTime)を取るため
# (src/metal_present.rs)。wgpu-hal が使っているのと同じ版に揃える
objc2-metal = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "MTLDrawable", "MTLCommandBuffer", "MTLCommandQueue",
    "MTLTexture", "MTLResource", "MTLAllocation", "MTLTypes",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal",
] }

# iOS: 消音スイッチで黙らないよう AVAudioSession のカテゴリを再生用にする
# (src/audio.rs)のと、遊んでいる間の自動ロック抑止(src/awake.rs)。
# 版は cpal が使っているものに揃える
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std", "AVAudioSession", "AVAudioSessionTypes",
] }

[dependencies]
cpal.workspace = true
# 既定機能そのまま(workspace 側で切ってあるので列挙する)。既定に含まれる
# winit/default は列挙できないが、下で winit を既定機能付きで直接引いているので同じになる
eframe = { workspace = true, features = [
    "accesskit", "default_fonts", "wayland", "web_screen_reader", "wgpu", "x11",
] }
pollster.workspace = true
resvg.workspace = true
socket2.workspace = true
# macOSのスケジューラにQoSを伝えるためだけに使う(pthread_set_qos_class_self_np)
libc.workspace = true
winit.workspace = true
if-addrs.workspace = true

# Android 版は android/ の別パッケージ。NativeActivity が共有ライブラリの
# android_main を呼ぶので lib が要るが、ここに [lib] を足すとデスクトップの
# ビルドでも本体を2回コンパイルすることになる。詳しくは android/Cargo.toml
[workspace]
members = ["android"]

# 両パッケージで同じ src/ をコンパイルするので、版はここ1か所で持つ
[workspace.dependencies]
cpal = "0.18.1"
# 既定機能の accesskit が Android の NativeActivity と両立しないので、既定は切って
# 各パッケージで選ぶ
eframe = { version = "0.35.0", default-features = false }
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
socket2 = "0.6.5"
libc = "0.2"
winit = "0.30.13"
if-addrs = "0.15.0"
