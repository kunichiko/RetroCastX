[package]
name = "retrocastx-viewer"
version = "0.2.1"
edition = "2024"

[target.'cfg(windows)'.dependencies]
# コンソール窓を出さずに起動し(windows_subsystem)、コンソールから起動された
# ときだけ親のコンソールへ出力を戻すため
# 残りの feature は NIC 受信バッファーの確認(src/netcheck.rs)に使う。
# 経路から NIC を引き、レジストリの *ReceiveBuffers を読む
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    # ConvertInterface* は LUID 型が Ndis 側にあるため、この feature の配下にある
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
# 実行ファイルへのアイコン埋め込み(build.rs)。Windows以外では取得も不要
winresource = "0.1"

# MimicX へのキー転送(src/remote_input.rs)。MimicX は macOS 版だけで、CoreMIDI も
# 同一マシン内の経路なので、依存ごと macOS に閉じる
[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
# 通常モード(eframe)で物理キーを取り出すため(src/keytap.rs)。egui の Key は
# JIS の ¥/_/かな を持たず、テンキーも最上段の数字に潰すので、AppKit の
# イベントを直接見るしかない
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }

[dependencies]
cpal = "0.18.1"
eframe = "0.35.0"
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
socket2 = "0.6.5"
# macOSのスケジューラにQoSを伝えるためだけに使う(pthread_set_qos_class_self_np)
libc = "0.2"
winit = "0.30.13"
if-addrs = "0.15.0"
